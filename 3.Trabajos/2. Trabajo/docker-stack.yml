version: '3.8'

services:
  backend:
    image: mmkk-backend:latest
    networks:
      - reverse_proxy
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
      placement:
        constraints:
          - node.role == manager

  frontend:
    image: mmkk-frontend:latest
    networks:
      - reverse_proxy
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
      placement:
        constraints:
          - node.role == manager
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=reverse_proxy"
        - "traefik.http.routers.mmkk-frontend.entrypoints=websecure"
        - "traefik.http.routers.mmkk-frontend.tls=true"
        - "traefik.http.routers.mmkk-frontend.tls.certresolver=production"
        - "traefik.http.routers.mmkk-frontend.rule=Host(`mmkk.glud.org`)"
        - "traefik.http.routers.mmkk-frontend.service=mmkk-frontend"
        - "traefik.http.services.mmkk-frontend.loadbalancer.server.port=80"

networks:
  reverse_proxy:
    driver: overlay
    external: true
